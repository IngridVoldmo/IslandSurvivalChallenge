            </section>
            <section>
                <ul class="loot-list">
                <li><span class="emoji">🧱</span> <span id="woodStatus">20</span></li>
                <li><span class="emoji">🥀</span> <span id="vineStatus">10</span></li>
                <li><span class="emoji">🍖</span> <span id="meatStatus">30</span></li>
                <li><span class="emoji">🏔️</span> <span id="stoneStatus">20</span></li>
            </ul>
            </section>
            <section class="craftedTools">
                <img class="grid-item" src="https://cdn.glitch.global/4ab89df4-051b-4f6c-b564-2317ed5cc084/Axe.png"></img>
                <img class="grid-item"></img>
                <img class="grid-item"></img>
                <img class="grid-item"></img>
            </section>
            
        </section>
        <section class="item2">
            <h1>Actions</h1>
            <ul class="action-list">
                <li><button onclick="performAction('hunt')">Hunt</button><span class="emoji">🍖</span></li>
                <li><button onclick="performAction('gather')">Gather</button><span class="emoji">🥀 🏔️ 🧱</span></p></li>
                <li><button onclick="performAction('rest')">Rest</button><span class="emoji">💪</span></li>
                <li><button onclick="performAction('sail away')">Sail away</button><span class="emoji">⛵</span></li>
            </ul>
        </section>
    </section>
    <section class="grid-container2">
        <section class="toolsection">

        </section>
        
        <section class="chooseToolSection">
            <section><label for="myDropdown">Choose an item to craft:</label>
            <select id="myDropdown" name="myDropdownName" onchange="showTool()">
                <option value="" disabled selected>Select an item to craft</option>
            </select></section>
            
            <button onclick="performAction('sail away')">Craft</button>
        </section>
        
    </section>
