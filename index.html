<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body style="background-color: black;">
    <section class="grid-container" >
        <section class="item1">
            <section class="survivor">
                <h1>Survivor</h1>
                <img class="styledimg" src="https://cdn.glitch.global/4ab89df4-051b-4f6c-b564-2317ed5cc084/Survivor.png?v=1729673697126"/>
                <p class="emoji">💪</p>
                <div class="bar">
                    <div class="fill" id="fill" style="width:70%">70%</div>
                </div>
            </section>
            <section>
                <ul class="loot-list">
                    <li><span class="emoji">🧱</span> <span id="woodStatus">20</span></li>
                    <li><span class="emoji">🥀</span> <span id="vineStatus">10</span></li>
                    <li><span class="emoji">🍖</span> <span id="meatStatus">30</span></li>
                    <li><span class="emoji">🏔️</span> <span id="stoneStatus">20</span></li>
                </ul>
            </section>
            <section>
                <h3>Crafted tools</h3>
                <section class="craftedTools">
            </section>
            </section>
            
            
        </section>
        <section class="actions">
            <h1>Actions</h1>
            <ul class="action-list">
                <li><button onclick="performAction('hunt')" id="hunt">Hunt</button><span class="emoji">🍖</span></li>
                <li><button onclick="performAction('gather' )" id="gather">Gather</button><span class="emoji">🥀 🏔️ 🧱</span></p></li>
                <li><button onclick="performAction('rest')">Rest</button><span class="emoji">💪</span></li>
                <li><button disabled onclick="performAction('sail away')">Sail away</button><span class="emoji">⛵</span></li>
            </ul>
        </section>
    </section>
    <section class="grid-container2">
        <section class="toolsection">
            <section class="tooldescription">
                <h2 id="title">Tool</h2>
                <p id="description">Description</p>
                <h3>Requirements</h3>
                <ul id="requirements"></ul>
            </section>
            <section class="toolImageSection">
                <img id="toolImage" class="toolImage" alt="Image of tool"> <img/>
            </section>
            
        </section>
        
        <section class="chooseToolSection">
            <section><label for="myDropdown">Choose an item to craft:</label>
            <select id="myDropdown" name="myDropdownName" onchange="showTool()">
                <option value="" disabled selected>Select an item to craft</option>
            </select></section>
            
            <button id="craft">Craft</button>
        </section>
        
    </section>
    
    
</body>
</html>
